{% load store_tags %}
{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Acceso · TechGear{% endblock %}</title>
  <meta name="description" content="Acceso al portal de gestión de TechGear.">
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
  <link rel="stylesheet" href="{% static 'store/css/catalog_auth.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="auth-body">
  <section class="auth-container" aria-label="Autenticación">
    <div class="auth__ambient" aria-hidden="true"></div>

    <a class="auth__close-btn" href="{% url 'store:catalog' %}" aria-label="Volver al inicio">
      {% icon "close" %}
    </a>

    {% if messages %}
      <div class="auth__messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <div class="auth__card">
      {% block content %}{% endblock %}
    </div>

  </section>

  <script src="{% static 'store/js/auth-ui.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
